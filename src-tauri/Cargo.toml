[package]
name = "madrasa-manager"
version = "2.7.0-foundation"
description = "Offline Madrasa Manager desktop application"
authors = ["Madrasa Manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "madrasa_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "madrasa-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
sha2 = "0.10"
thiserror = "2"
parking_lot = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "protocol-asset"] }

[dev-dependencies]
tempfile = "3"
